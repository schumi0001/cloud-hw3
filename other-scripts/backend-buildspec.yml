version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
  build:
    on-failure: ABORT
    commands:
      - python3 -m unittest discover -s other-scripts/tests -v
      - python3 other-scripts/package.py
      - python3 other-scripts/deploy.py

artifacts:
  base-directory: dist
  files:
    - index-photos.zip
    - search-photos.zip
    - build-manifest.json
